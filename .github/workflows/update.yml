name: Aktualizacja danych
on:
  schedule:
    - cron: "*/15 * * * 1-5"   # dni robocze: co 15 minut
    - cron: "7 */2 * * 0,6"    # weekend: co 2 godziny (Bitcoin handluje całą dobę)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_data.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "dane-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Aktualizacja danych" && git push)
