name: Zmiana listy instrumentów
# Uruchamia się, gdy właściciel repozytorium utworzy zgłoszenie (issue) z tytułem "Dodaj: ..." lub "Usuń: ...".
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: lista
  cancel-in-progress: false
jobs:
  manage:
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zmień listę
        run: python manage_instruments.py
        env:
          TITLE: ${{ github.event.issue.title }}
      - name: Zapisz listę i od razu przelicz dane
        if: always()
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat changed)" = "1" ]; then
            git config user.name "dane-bot"
            git config user.email "bot@users.noreply.github.com"
            git add instruments.json
            git commit -m "Lista instrumentów: ${ISSUE_TITLE}"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
            git fetch -q origin dane || true
            git show origin/dane:data.json > /tmp/d.json 2>/dev/null && mv /tmp/d.json data.json || true
            git show origin/dane:track.json > /tmp/t.json 2>/dev/null && mv /tmp/t.json track.json || true
          git show origin/dane:model.json > /tmp/m.json 2>/dev/null && mv /tmp/m.json model.json || true
          git show origin/dane:replay.json > /tmp/r.json 2>/dev/null && mv /tmp/r.json replay.json || true
            python fetch_data.py
            d=$(mktemp -d); cp data.json "$d"/; cp track.json model.json replay.json "$d"/ 2>/dev/null || true
            (cd "$d" && git init -q -b dane && git add . && git -c user.name=dane-bot -c user.email=bot@users.noreply.github.com commit -qm "Dane po zmianie listy" \
              && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dane)
          fi
      - name: Odpowiedz i zamknij zgłoszenie
        if: always()
        run: |
          gh issue comment "$NUM" --body-file result.md || true
          gh issue close "$NUM" || true
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
